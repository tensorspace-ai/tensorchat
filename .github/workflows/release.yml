name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Built once and shared by every platform archive — the frontend is
  # architecture-independent.
  web:
    name: web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/

  binaries:
    name: ${{ matrix.target }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per target — this avoids cross-compiling, which
          # rusqlite's bundled SQLite would make painful.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # No x86_64-apple-darwin: GitHub is retiring the Intel macos-13
          # image and the job sat unscheduled. Intel Mac users build from
          # source, which is two commands.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tensorchat-server

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist

      - name: Package
        id: package
        shell: bash
        env:
          # On a tag push this is the tag; on workflow_dispatch GITHUB_REF_NAME
          # would be the branch, so the input wins.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="tensorchat-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}/web"
          cp "target/${{ matrix.target }}/release/tensorchat" "dist/${name}/"
          cp -R web-dist/. "dist/${name}/web/"
          cp README.md ARCHITECTURE.md LICENSE CHANGELOG.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          shasum -a 256 "dist/${name}.tar.gz" | awk '{print $1"  '"${name}"'.tar.gz"}' \
            > "dist/${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: publish release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: tensorchat-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            artifacts/*

  # Deliberately last, and deliberately gated on the GitHub release: crates.io
  # cannot be undone, so it runs only once the binaries and the release exist.
  # If an earlier job fails there is still a version number left unspent.
  #
  # The order is the dependency order — core, then store, then server — because
  # each has to be on the registry before the next one can resolve it.
  # `--no-verify` is not used: the whole point is to build what was packaged.
  crates-io:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # One invocation rather than three: cargo then publishes in dependency
      # order itself and waits for each crate to appear in the index, which
      # three separate commands would race.
      - run: cargo publish --locked -p tensorchat-core -p tensorchat-store -p tensorchat-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  image:
    name: publish image
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
