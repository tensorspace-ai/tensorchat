version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for the routine patch churn across the whole tree; anything
    # minor or major arrives on its own so it gets read.
    groups:
      cargo-patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # `dtolnay/rust-toolchain@1.95.0` is an MSRV pin wearing an action version.
    # Dependabot read it as one and opened a PR moving it to 1.100.0, which is
    # the job that exists to enforce the floor declared in Cargo.toml. That PR
    # failed only because the version does not exist yet; a real one would have
    # gone green while testing a toolchain nothing claims to support.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
