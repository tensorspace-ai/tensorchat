# cargo-deny: what may end up inside a released binary or image.
#
# Three questions CI could not previously answer: are any dependencies subject
# to a published advisory, what licences are being redistributed, and is
# anything coming from somewhere other than crates.io.

[graph]
all-features = true
# The targets the release actually builds. Without this the check only sees the
# graph for whichever runner happened to run it, and most dependencies with
# interesting licences are platform-specific.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Every entry is permissive and compatible with redistributing a statically
# linked MIT binary. Anything not listed fails the build rather than being
# waved through, so a new dependency's terms are a decision someone makes.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The list covers four targets, so on any one of them some entries go unused.
# That is the list doing its job, not a finding.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
