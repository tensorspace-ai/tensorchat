<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TensorChat</title>
    <meta name="description" content="Fast, self-hosted team chat." />
    <meta name="color-scheme" content="dark light" />
    <!--
      Both assets are content-hashed and served with a one-year immutable
      cache; the build rewrites these hrefs. Preloading the module lets the
      browser start fetching it in parallel with the stylesheet rather than
      after it.
    -->
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="modulepreload" href="/assets/app.js" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 12h14M9 17h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>TensorChat needs JavaScript enabled.</noscript>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
