[package]
name = "tensorchat-server"
description = "TensorChat server: HTTP API, WebSocket hub, and authentication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

# The crate is `tensorchat-server` because `tensorchat` alone would claim the
# name for a library that does not exist yet; the command people type is just
# `tensorchat`.
[[bin]]
name = "tensorchat"
path = "src/main.rs"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws", "macros", "multipart"] }
base64 = "0.23.0"
bytes = "1.12.1"
dashmap = "6.2.1"
futures-util = "0.3.33"
mime_guess = "2.0.5"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
parking_lot = "0.12.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json"] }
rmp-serde = "1.3.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tensorchat-core = { version = "0.2.0", path = "../tensorchat-core" }
tensorchat-store = { version = "0.2.0", path = "../tensorchat-store" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "compression-br", "compression-gzip", "trace", "cors", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
